# Publish a tagged release to the real PyPI with Trusted Publishing.
#
# There is no API token anywhere in this repository. The publish job asks GitHub
# for a short-lived OIDC token with `id-token: write`, the PyPI trusted publisher
# exchanges it for a single-use upload credential, and that credential expires
# with the job. There is no secret to store, rotate, leak or revoke.
#
# Every action is pinned to a full commit SHA, the same rule RC220 asks of an
# analysed project. The human-readable tag sits next to each pin, and the SHAs
# were resolved with `git ls-remote --tags`, not copied from anywhere.
#
# `checkout` and `setup-python` deliberately carry the same pins as `ci.yml`.
# Giving this workflow newer ones made ReproCheck's own scan report RC221, an
# inconsistent version of the same action, and a repository that reports itself
# should not carry a finding it can simply avoid. A test enforces it.
#
# The artifact pair moved together. `upload-artifact@v6.0.0` and
# `download-artifact@v7.0.0` are the first releases of each that declare
# `runs.using: node24` - v5 of upload and v5/v6 of download still declare
# node20, so going to the newest major would have been a bigger jump for no
# gain. Both are the same v4+ artifact backend, and both need runner 2.327.1 or
# newer, which GitHub-hosted runners already satisfy.
#
# The trigger is a tag push, never a push to main: a release must be something
# a person decided to cut, and the version in the tag is checked against the
# version in the package metadata before anything is uploaded.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build the distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install the build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build
        run: python -m build

      - name: Check the metadata
        run: python -m twine check --strict dist/*

      - name: Audit the artifacts
        run: python scripts/validate_release.py --audit-only

      - name: The tag must match the package version
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(python -c "import reprocheck; print(reprocheck.__version__)")"
          # The distribution is "reprocheck-cli", but setuptools normalises the
          # hyphen to an underscore in the artifact filename, per PEP 427. The
          # check has to look for what is actually written to disk.
          wheel="dist/reprocheck_cli-${package_version}-py3-none-any.whl"
          sdist="dist/reprocheck_cli-${package_version}.tar.gz"
          echo "tag:     $tag_version"
          echo "package: $package_version"
          if [ "$tag_version" != "$package_version" ]; then
            echo "refusing to release: $GITHUB_REF_NAME does not match the package version"
            exit 1
          fi
          for artifact in "$wheel" "$sdist"; do
            if [ ! -f "$artifact" ]; then
              echo "refusing to release: $artifact is missing"
              ls -1 dist || true
              exit 1
            fi
          done
          echo "tag and package agree on $package_version"

      - name: Record the digests
        run: python -c "import hashlib,pathlib;[print(hashlib.sha256(p.read_bytes()).hexdigest(),p.name) for p in sorted(pathlib.Path('dist').iterdir())]"

      - name: Keep the artifacts for the publish job
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment is part of what the PyPI trusted publisher is configured
    # with. The PyPI side also decides whether a human must approve the job;
    # this repository does not require one, so a tag push is enough.
    environment:
      name: pypi
    permissions:
      # This is the whole point: it lets the job mint an OIDC token, and
      # nothing else. It does not grant access to the repository.
      id-token: write
    steps:
      - name: Take the artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # No user, no password, no token: the action exchanges the OIDC token
        # this job was granted for a single-use upload credential.
        with:
          print-hash: true
