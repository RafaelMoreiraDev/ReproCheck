# Continuous integration for ReproCheck itself.
#
# Every action is pinned to a full commit SHA, which is what RC220 asks of a
# project: a tag is a mutable reference. The human-readable tag is kept in a
# comment next to each pin, and the SHAs were resolved with
# `git ls-remote https://github.com/<action> refs/tags/<tag>`; none of them is
# invented.
#
# The matrix lists the Python versions this project actually exercises. It is
# not a claim about versions nobody tested.
#
# The pins are the first releases of each action that declare
# `runs.using: node24`. `checkout@v4.2.2` and `setup-python@v5.6.0` declared
# node20, which GitHub has deprecated; the runners now force them onto Node 24
# and print a warning on every run. `release.yml` carries the same two pins on
# purpose - a test fails if they drift apart, because different versions of one
# action in two workflows is what RC221 reports.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the minimum declared in pyproject.toml; 3.12 and 3.13 are the
        # versions the local environment exercises alongside it.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test
        run: python -m pytest

      - name: Self-check
        run: |
          python -m reprocheck --version
          python -m reprocheck scan . --json dist/self-scan.json

  package:
    name: build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          # The packaging job builds and installs on one known version. It does
          # not have to be the newest: the matrix above is where support is
          # claimed, and leaving this unset would silently use whatever the
          # runner image happens to ship.
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build
        run: python -m build

      - name: Check the metadata
        run: python -m twine check --strict dist/*

      - name: Audit the artifacts
        run: python scripts/validate_release.py --audit-only

      - name: Install the wheel in a clean environment and smoke it
        run: python scripts/validate_release.py --skip-build
