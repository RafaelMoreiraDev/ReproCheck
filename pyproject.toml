[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reprocheck-cli"
# The distribution is named "reprocheck-cli" because the PyPI refuses
# "reprocheck" for similarity with an unrelated project that already owns
# "repro-check". The product is still ReproCheck, the command is still
# `reprocheck`, and the importable package is still `reprocheck`. Only the name
# on the index changed, and it is the only thing that had to.
#
# The version lives in exactly one place: src/reprocheck/__init__.py. Declaring
# it dynamic here means pyproject and the package can never disagree.
dynamic = ["version"]
description = "Read-only reproducibility scanner for Python projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# PEP 639: the SPDX expression above replaces the ``License ::`` classifier,
# and setuptools refuses both at once.
license-files = ["LICENSE"]
authors = [{ name = "Rafael Antonio Brito Moreira" }]
maintainers = [{ name = "Rafael Antonio Brito Moreira" }]
keywords = [
  "reproducibility",
  "scanner",
  "static-analysis",
  "read-only",
  "supply-chain",
  "provenance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "packaging>=23.0",
  # Conda environment files are YAML. PyYAML is used with safe_load only, so
  # no custom tag can construct an arbitrary object. 6.0.2 is the floor because
  # it is the first release with Python 3.13 wheels; 6.0.3 adds 3.14 wheels, so
  # every Python this project supports installs without building from source.
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
# Development and test tooling only. The runtime dependency set stays at one
# package on purpose: a scanner people are asked to trust should not drag a
# tree of libraries into their environment.
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "build>=1.2",
  "twine>=5.1",
]

[project.scripts]
reprocheck = "reprocheck.cli:main"

[project.urls]
Homepage = "https://github.com/RafaelMoreiraDev/ReproCheck"
Source = "https://github.com/RafaelMoreiraDev/ReproCheck"
Issues = "https://github.com/RafaelMoreiraDev/ReproCheck/issues"
Changelog = "https://github.com/RafaelMoreiraDev/ReproCheck/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "reprocheck.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
# Runs only where a real Conda-compatible manager is installed. Never part of
# the default gate, because a test that silently skips is not a gate.
markers = [
  "conda_integration: needs a real conda, mamba or micromamba on PATH",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
